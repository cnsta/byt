[package]
name = "byt"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A terminal-based VPN switcher for Linux (NetworkManager + Tailscale)"
license = "MIT"
readme = "README.md"
repository = ""
keywords = ["vpn", "tui", "wireguard", "tailscale", "networkmanager"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "sync",
    "time",
    "fs",
    "signal",
] }
tokio-util = "0.7"
futures = "0.3"
clap = { version = "4", features = ["derive", "wrap_help"] }
thiserror = "2"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.31", features = ["fs"] }
directories = "6"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
