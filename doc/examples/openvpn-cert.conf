# OpenVPN — certificate auth example.
#
# Some providers issue per-user client certificates instead of (or in
# addition to) username/password. Three inline blocks instead of two:
# <ca>, <cert>, <key>. No `auth-user-pass` directive.
#
# As with the userpass example, the inline blocks are placeholders; the
# file will not import as-is.

client
dev tun
remote vpn.example.com 1194
proto udp

resolv-retry infinite
nobind
persist-key
persist-tun

cipher AES-256-GCM
data-ciphers AES-256-GCM:CHACHA20-POLY1305
verb 3

<ca>
-----BEGIN CERTIFICATE-----
PLACEHOLDER_CA_CERTIFICATE_BASE64_REPLACE_WITH_PROVIDER_CA
-----END CERTIFICATE-----
</ca>

<cert>
-----BEGIN CERTIFICATE-----
PLACEHOLDER_CLIENT_CERTIFICATE_BASE64_REPLACE_WITH_PROVIDER_CERT
-----END CERTIFICATE-----
</cert>

<key>
-----BEGIN PRIVATE KEY-----
PLACEHOLDER_CLIENT_PRIVATE_KEY_BASE64_REPLACE_WITH_PROVIDER_KEY
-----END PRIVATE KEY-----
</key>
