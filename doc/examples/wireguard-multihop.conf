# WireGuard — multi-hop example
#
# The file format is identical to single-hop: one [Interface], one [Peer].
# Multi-hop is implemented on the provider's side (they chain the entry
# endpoint to an exit node). From the client's perspective there is nothing
# special to configure.

[Interface]
PrivateKey = __YOUR_PRIVATE_KEY_BASE64__
Address = 198.51.100.3/32, 2001:db8:1::3/128
DNS = 198.51.100.1, 2001:db8:1::1

[Peer]
PublicKey = __SERVER_PUBLIC_KEY_BASE64__
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = wg-multi-entry.vpn.example.com:51820
